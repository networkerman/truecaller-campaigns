name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

env:
  AWS_REGION: ap-south-1

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # App Runner watches :latest and redeploys on its own
      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" server
          docker push --all-tags "$IMAGE"
      # The campaign worker runs the same image on ECS; restart it on the new :latest
      - name: Roll the campaign worker
        if: vars.WORKER_SERVICE != ''
        run: aws ecs update-service --cluster "${{ vars.WORKER_CLUSTER }}" --service "${{ vars.WORKER_SERVICE }}" --force-new-deployment > /dev/null

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build
        working-directory: web
        run: |
          VITE_API_KEY=$(aws secretsmanager get-secret-value --secret-id "${{ vars.APP_SECRET_ARN }}" \
            --query SecretString --output text | jq -r '.API_KEYS | split(",")[0]')
          echo "::add-mask::$VITE_API_KEY"
          npm ci
          VITE_API_KEY="$VITE_API_KEY" npm run build
      - name: Upload and invalidate
        run: |
          aws s3 sync web/dist "s3://${{ vars.WEB_BUCKET }}" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_ID }}" --paths /index.html
