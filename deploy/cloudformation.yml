AWSTemplateFormatVersion: '2010-09-09'
Description: Truecaller Campaigns POC - one EC2 host running Postgres, API and dashboard via Docker Compose.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ServerRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: truecaller-campaigns/server
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  WebRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: truecaller-campaigns/web
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: read-app-params
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/truecaller/*

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Truecaller Campaigns web traffic (no SSH; access is through SSM)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      SecurityGroupIds: [!GetAtt HostSecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: truecaller-campaigns }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/truecaller
          touch /opt/truecaller/.bootstrapped

  HostIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Host

Outputs:
  PublicIp:
    Description: Point the domain's A record here
    Value: !Ref HostIp
  InstanceId:
    Value: !Ref Host
  ServerRepoUri:
    Value: !GetAtt ServerRepo.RepositoryUri
  WebRepoUri:
    Value: !GetAtt WebRepo.RepositoryUri
